[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dex_retargeting"
version = "0.5.0"
description = "Hand pose retargeting for dexterous robot hand."
authors = [{ name = "Yuzhe Qin", email = "y1qin@ucsd.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { "Homepage" = "https://github.com/dexsuite/dex-retargeting" }

dependencies = [
    "numpy>=2.0.0",
    "pytransform3d>=3.5.0",
    "pin>=3.3.1",
    "nlopt>=2.8.0",
    "anytree>=2.12.0",
    "pyyaml>=6.0.0",
    "lxml>=5.2.2",
    "h5py>=3.14.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "isort"]
torch-cu124 = ["torch==2.6.0+cu124"]
torch-cu128 = ["torch==2.10.0+cu128"]
example = [
    "tyro",
    "tqdm",
    "opencv-python",
    "mediapipe",
    "sapien==3.0.0b0",
    "loguru",
    "viser[urdf]",
    "rerun-sdk==0.33.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "extra == 'torch-cu124'" },
    { index = "pytorch-cu128", marker = "extra != 'torch-cu124' and extra == 'torch-cu128'" },
]

[tool.uv]
conflicts = [
    [
        { extra = "torch-cu124" },
        { extra = "torch-cu128" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["dex_retargeting"]
split-on-trailing-comma = false

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
addopts = "--disable-warnings"
testpaths = ["tests"]
